steps = "Use Rust with macroquad (a small game library). Create a cargo project in app/ itself (app/Cargo.toml and app/src/main.rs, not a folder inside app/), keep assets procedural (shapes, colours) unless the person provides some, and run `cargo build` until it succeeds."

